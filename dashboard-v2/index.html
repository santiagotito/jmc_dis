<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DISOR Analytics 2.0</title>
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <span>DISOR</span>
        </div>
        <nav class="menu-inner">
          <div class="menu-item active" data-page="resumen">
            <a href="#" class="menu-link">
              <i class="ri-dashboard-line"></i>
              <span>Resumen</span>
            </a>
          </div>
          <div class="menu-item" data-page="promocion">
            <a href="#" class="menu-link">
              <i class="ri-rocket-2-line"></i>
              <span>Promoción</span>
            </a>
          </div>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="content">
        <!-- Navbar -->
        <header class="navbar">
          <div class="navbar-content">
            <h4 id="page-title">Resumen General</h4>
            <div id="filter-bar" class="chips-container">
              <!-- Years will be injected here -->
            </div>
          </div>
        </header>

        <!-- Viewport -->
        <div id="app" class="viewport">
          <!-- Views will be rendered here -->
        </div>
      </main>
    </div>
    
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
